<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="page-title">BtcAIWork | Стейкинг</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="bg-dark text-light">
  <div class="bg-animated"></div>
  <canvas id="hashWave" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;"></canvas>
  <header class="text-center mt-3">
    <h1 class="text-info" id="title">BtcAIWork</h1>
    <div class="d-flex flex-wrap justify-content-center mt-2">
      <a href="index.html"><button class="btn btn-nav" id="nav-index">Главная</button></a>
      <a href="dashboard.html"><button class="btn btn-nav" id="nav-dashboard">Статистика</button></a>
      <a href="Tokens.html"><button class="btn btn-nav" id="nav-tokens">Купить токены</button></a>
      <a href="Staking.html"><button class="btn btn-nav" id="nav-staking">Стейкинг</button></a>
      <a href="Profile.html"><button class="btn btn-nav" id="nav-profile">Профиль</button></a>
      <a href="scripts.html"><button class="btn btn-nav" id="nav-scripts">Скрипты</button></a>
      <a href="Connection.html"><button class="btn btn-nav" id="nav-connection">Связь</button></a>
      <a href="Roadmap.html"><button class="btn btn-nav" id="nav-roadmap">Дорожная карта</button></a>
      <button id="lang-btn" onclick="toggleLanguage()" class="btn btn-sm btn-info ms-2">EN</button>
    </div>
  </header>
  <main class="container mt-5 bg-black p-4 rounded">
    <h2 id="staking-title" class="mb-3 text-info">Стейкинг токенов</h2>
    <p id="staking-description" class="mb-4">Введите количество токенов и BTC-кошелёк для стейкинга.</p>
    <form id="stakingForm">
      <div class="mb-3">
        <label id="label-wallet" for="wallet" class="form-label">Адрес кошелька:</label>
        <input type="text" class="form-control" id="wallet" required />
      </div>
      <div class="mb-3">
        <label id="label-amount" for="amount" class="form-label">Количество токенов:</label>
        <input type="number" class="form-control" id="amount" min="1" required />
      </div>
      <div class="mb-3">
        <label id="duration-label" for="duration" class="form-label">Срок:</label>
        <select class="form-select" id="duration">
          <option value="30" id="duration-30">30 дней</option>
          <option value="60" id="duration-60">60 дней</option>
          <option value="90" id="duration-90">90 дней</option>
        </select>
      </div>
      <button type="submit" id="submit-button" class="btn btn-info w-100">Отправить в стейкинг</button>
    </form>
  </main>
  <footer class="text-center mt-5 text-muted"><p id="footer-text">© 2025 Bitcoin Solo Mining Pool. Все права защищены.</p></footer>
  <script src="../static/js/script.js"></script>
</body>
</html>
