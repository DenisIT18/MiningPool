<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">BtcAIWork | Скрипты</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="bg-dark text-light">
  <div class="bg-animated"></div>
  <canvas id="hashWave" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;"></canvas>
  <header class="text-center mt-3">
    <h1 class="text-info" id="title">BtcAIWork</h1>
    <div class="d-flex flex-wrap justify-content-center mt-2">
      <a href="index.html"><button class="btn btn-nav" id="nav-index">Главная</button></a>
      <a href="dashboard.html"><button class="btn btn-nav" id="nav-dashboard">Статистика</button></a>
      <a href="Tokens.html"><button class="btn btn-nav" id="nav-tokens">Купить токены</button></a>
      <a href="Staking.html"><button class="btn btn-nav" id="nav-staking">Стейкинг</button></a>
      <a href="Profile.html"><button class="btn btn-nav" id="nav-profile">Профиль</button></a>
      <a href="scripts.html"><button class="btn btn-nav" id="nav-scripts">Скрипты</button></a>
      <a href="Connection.html"><button class="btn btn-nav" id="nav-connection">Связь</button></a>
      <a href="Roadmap.html"><button class="btn btn-nav" id="nav-roadmap">Дорожная карта</button></a>
      <button id="lang-btn" onclick="toggleLanguage()" class="btn btn-sm btn-info ms-2">EN</button>
    </div>
  </header>
  <main class="container text-center mt-4 bg-black p-4 rounded">
    <h2 id="scripts-title" class="mb-3 text-info">Запуск Python-скриптов</h2>
    <p id="scripts-description" class="mb-4">Выберите скрипт из списка для запуска:</p>
    <div class="d-grid gap-2 d-md-block">
      <button onclick="runScript('extract_nonce')" class="btn btn-outline-info m-1">extract_nonce</button>
      <button onclick="runScript('import_requests')" class="btn btn-outline-info m-1">import_requests</button>
      <button onclick="runScript('make_full_block_node')" class="btn btn-outline-info m-1">make_full_block_node</button>
      <button onclick="runScript('predict_range')" class="btn btn-outline-info m-1">predict_range</button>
      <button onclick="runScript('target')" class="btn btn-outline-info m-1">target</button>
      <button onclick="runScript('train_ai')" class="btn btn-outline-info m-1">train_ai</button>
    </div>
    <pre id="script-output" class="mt-4 p-3 bg-dark text-info rounded border border-info">Результат выполнения будет здесь...</pre>
  </main>
  <footer class="text-center mt-5 text-muted"><p id="footer-text">© 2025 Bitcoin Solo Mining Pool. Все права защищены.</p></footer>
  <script src="../static/js/script.js"></script>
</body>
</html>
